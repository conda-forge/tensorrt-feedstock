context:
  full_version: "10.16.1.11"
  version: "10.16.1"
  soname: "10"

recipe:
  name: tensorrt
  version: ${{ full_version }}

source:
  - if: linux and x86_64 and match(cuda_compiler_version, ">=12,<13")
    then:
      url: https://developer.download.nvidia.com/compute/machine-learning/tensorrt/${{ version }}/tars/TensorRT-${{ full_version }}.Linux.x86_64-gnu.cuda-12.9.tar.gz
      file_name: tensorrt.tar.gz
      sha256: 48e64fc9231fe3aeaa18be13385b486ea7c7131dd64f09b54e5fcb051386f014
  - if: linux and x86_64 and match(cuda_compiler_version, ">=13,<14")
    then:
      url: https://developer.download.nvidia.com/compute/machine-learning/tensorrt/${{ version }}/tars/TensorRT-${{ full_version }}.Linux.x86_64-gnu.cuda-13.2.tar.gz
      file_name: tensorrt.tar.gz
      sha256: 08334948c57c3bcf2de171ef4bd53d15f48a61a942b048abea12e32f892284e8
  - if: linux and aarch64 and match(cuda_compiler_version, ">=13,<14") and arm_variant_type == "sbsa"
    then:
      url: https://developer.download.nvidia.com/compute/machine-learning/tensorrt/${{ version }}/tars/TensorRT-${{ full_version }}.Linux.aarch64-gnu.cuda-13.2.tar.gz
      file_name: tensorrt.tar.gz
      sha256: 63ecfb16d2df932cc5c3f2a362ae6281919f565c5ca3a5e1299c95780e165c91
  - if: win and x86_64 and match(cuda_compiler_version, ">=12,<13")
    then:
      url: https://developer.download.nvidia.com/compute/machine-learning/tensorrt/${{ version }}/zip/TensorRT-${{ full_version }}.Windows.amd64.cuda-12.9.zip
      file_name: tensorrt.zip
      sha256: 80bbe8e07a4fccde33ae7d210ffc0e6d1af96dae5ffaaeed60209f775fbf4275
  - if: win and x86_64 and match(cuda_compiler_version, ">=13,<14")
    then:
      url: https://developer.download.nvidia.com/compute/machine-learning/tensorrt/${{ version }}/zip/TensorRT-${{ full_version }}.Windows.amd64.cuda-13.2.zip
      file_name: tensorrt.zip
      sha256: 7c853a0e8e9e65935add3d20f89ebfa1971f8e5ab5dce25d4532aecda52c232b

build:
  number: 0
  script:
    - if: win
      then: call "%RECIPE_DIR%\build.bat"
      else: bash "${RECIPE_DIR}/build.sh"
  skip:
    - cuda_compiler_version is undefined or cuda_compiler_version == "None"
    - not (linux or win)
    - aarch64 and (not match(cuda_compiler_version, ">=13,<14") or arm_variant_type != "sbsa")
  dynamic_linking:
    # TensorRT ships prebuilt shared libraries, so RPATH rewriting is not needed
    # and patchelf corrupts them.
    # xref: https://github.com/NixOS/patchelf/issues/492
    binary_relocation: true

outputs:
  - package:
      name: libnvinfer
    requirements:
      build:
        - ${{ compiler("c") }}
        - ${{ compiler("cxx") }}
        - ${{ compiler("cuda") }}
        - ${{ stdlib("c") }}
        - if: linux
          then:
            - cf-nvidia-tools ==1
            - tar
        - if: win
          then:
            - libarchive
        - if: aarch64
          then: arm-variant * ${{ arm_variant_type }}
      host:
        - cuda-version ==${{ cuda_compiler_version }}
      run:
        - ${{ pin_compatible("cuda-version", lower_bound="x", upper_bound="x") }}
        - cuda-cudart
        - cuda-nvrtc
      run_constraints:
        - if: aarch64
          then: arm-variant * ${{ arm_variant_type }}
      ignore_run_exports:
        by_name:
          - cuda-version
    tests:
      - package_contents:
          files:
            - if: linux
              then:
                - lib/libnvinfer.so.${{ version }}
                - lib/libnvinfer_builder_resource_ptx.so.${{ version }}
            - if: win
              then:
                - Library/bin/nvinfer_${{ soname }}.dll
                - Library/bin/nvinfer_builder_resource_ptx_${{ soname }}.dll
    about:
      summary: TensorRT standard runtime library

  - package:
      name: libnvinfer-win-builder-resource
    build:
      skip:
        - win
        - cuda_compiler_version is undefined or cuda_compiler_version == "None"
        - not (linux and x86_64)
    requirements:
      build:
        - ${{ compiler("c") }}
        - ${{ compiler("cxx") }}
        - ${{ compiler("cuda") }}
        - ${{ stdlib("c") }}
        - if: linux
          then:
            - cf-nvidia-tools ==1
            - tar
        - if: aarch64
          then: arm-variant * ${{ arm_variant_type }}
      host:
        - cuda-version ==${{ cuda_compiler_version }}
      run:
        - ${{ pin_compatible("cuda-version", lower_bound="x", upper_bound="x") }}
        - ${{ pin_subpackage("libnvinfer", exact=True) }}
      run_constraints:
        - if: aarch64
          then: arm-variant * ${{ arm_variant_type }}
      ignore_run_exports:
        by_name:
          - cuda-version
    tests:
      - package_contents:
          files:
            - if: linux
              then: lib/libnvinfer_builder_resource_win_ptx.so.${{ version }}
    about:
      summary: TensorRT Windows builder resource library

  - package:
      name: libnvinfer-dispatch
    requirements:
      build:
        - ${{ compiler("c") }}
        - ${{ compiler("cxx") }}
        - ${{ compiler("cuda") }}
        - ${{ stdlib("c") }}
        - if: linux
          then:
            - cf-nvidia-tools ==1
            - tar
        - if: win
          then:
            - libarchive
        - if: aarch64
          then: arm-variant * ${{ arm_variant_type }}
      host:
        - cuda-version ==${{ cuda_compiler_version }}
      run:
        - ${{ pin_compatible("cuda-version", lower_bound="x", upper_bound="x") }}
        - cuda-cudart
      run_constraints:
        - if: aarch64
          then: arm-variant * ${{ arm_variant_type }}
      ignore_run_exports:
        by_name:
          - cuda-version
    tests:
      - package_contents:
          files:
            - if: linux
              then: lib/libnvinfer_dispatch.so.${{ version }}
            - if: win
              then: Library/bin/nvinfer_dispatch_${{ soname }}.dll
    about:
      summary: TensorRT dispatch runtime library

  - package:
      name: libnvinfer-lean
    requirements:
      build:
        - ${{ compiler("c") }}
        - ${{ compiler("cxx") }}
        - ${{ compiler("cuda") }}
        - ${{ stdlib("c") }}
        - if: linux
          then:
            - cf-nvidia-tools ==1
            - tar
        - if: win
          then:
            - libarchive
        - if: aarch64
          then: arm-variant * ${{ arm_variant_type }}
      host:
        - cuda-version ==${{ cuda_compiler_version }}
      run:
        - ${{ pin_compatible("cuda-version", lower_bound="x", upper_bound="x") }}
        - cuda-cudart
      run_constraints:
        - if: aarch64
          then: arm-variant * ${{ arm_variant_type }}
      ignore_run_exports:
        by_name:
          - cuda-version
    tests:
      - package_contents:
          files:
            - if: linux
              then: lib/libnvinfer_lean.so.${{ version }}
            - if: win
              then: Library/bin/nvinfer_lean_${{ soname }}.dll
    about:
      summary: TensorRT lean runtime library

  - package:
      name: libnvinfer-plugin
    requirements:
      build:
        - ${{ compiler("c") }}
        - ${{ compiler("cxx") }}
        - ${{ compiler("cuda") }}
        - ${{ stdlib("c") }}
        - if: linux
          then:
            - cf-nvidia-tools ==1
            - tar
        - if: win
          then:
            - libarchive
        - if: aarch64
          then: arm-variant * ${{ arm_variant_type }}
      host:
        - cuda-version ==${{ cuda_compiler_version }}
        - ${{ pin_subpackage("libnvinfer", exact=True) }}
      run:
        - ${{ pin_compatible("cuda-version", lower_bound="x", upper_bound="x") }}
        - ${{ pin_subpackage("libnvinfer", exact=True) }}
        - cuda-cudart
      run_constraints:
        - if: aarch64
          then: arm-variant * ${{ arm_variant_type }}
      ignore_run_exports:
        by_name:
          - cuda-version
    tests:
      - package_contents:
          files:
            - if: linux
              then: lib/libnvinfer_plugin.so.${{ version }}
            - if: win
              then: Library/bin/nvinfer_plugin_${{ soname }}.dll
    about:
      summary: TensorRT plugin runtime library

  - package:
      name: libnvinfer-vc-plugin
    requirements:
      build:
        - ${{ compiler("c") }}
        - ${{ compiler("cxx") }}
        - ${{ compiler("cuda") }}
        - ${{ stdlib("c") }}
        - if: linux
          then:
            - cf-nvidia-tools ==1
            - tar
        - if: win
          then:
            - libarchive
        - if: aarch64
          then: arm-variant * ${{ arm_variant_type }}
      host:
        - cuda-version ==${{ cuda_compiler_version }}
      run:
        - ${{ pin_compatible("cuda-version", lower_bound="x", upper_bound="x") }}
      run_constraints:
        - if: aarch64
          then: arm-variant * ${{ arm_variant_type }}
      ignore_run_exports:
        by_name:
          - cuda-version
    tests:
      - package_contents:
          files:
            - if: linux
              then: lib/libnvinfer_vc_plugin.so.${{ version }}
            - if: win
              then: Library/bin/nvinfer_vc_plugin_${{ soname }}.dll
    about:
      summary: TensorRT version-compatible plugin runtime library

  - package:
      name: libnvonnxparser
    requirements:
      build:
        - ${{ compiler("c") }}
        - ${{ compiler("cxx") }}
        - ${{ compiler("cuda") }}
        - ${{ stdlib("c") }}
        - if: linux
          then:
            - cf-nvidia-tools ==1
            - tar
        - if: win
          then:
            - libarchive
        - if: aarch64
          then: arm-variant * ${{ arm_variant_type }}
      host:
        - cuda-version ==${{ cuda_compiler_version }}
      run:
        - ${{ pin_compatible("cuda-version", lower_bound="x", upper_bound="x") }}
        - ${{ pin_subpackage("libnvinfer", exact=True) }}
      run_constraints:
        - if: aarch64
          then: arm-variant * ${{ arm_variant_type }}
      ignore_run_exports:
        by_name:
          - cuda-version
    tests:
      - package_contents:
          files:
            - if: linux
              then: lib/libnvonnxparser.so.${{ version }}
            - if: win
              then: Library/bin/nvonnxparser_${{ soname }}.dll
    about:
      summary: TensorRT ONNX parser runtime library

  - package:
      name: tensorrt-tools
    requirements:
      build:
        - ${{ compiler("c") }}
        - ${{ compiler("cxx") }}
        - ${{ stdlib("c") }}
        - if: linux
          then:
            - cf-nvidia-tools ==1
            - tar
        - if: win
          then:
            - libarchive
        - if: aarch64
          then: arm-variant * ${{ arm_variant_type }}
      host:
        - cuda-version ==${{ cuda_compiler_version }}
        - ${{ pin_subpackage("libnvinfer", exact=True) }}
        - ${{ pin_subpackage("libnvinfer-plugin", exact=True) }}
        - ${{ pin_subpackage("libnvonnxparser", exact=True) }}
      run:
        - ${{ pin_compatible("cuda-version", lower_bound="x", upper_bound="x") }}
        - ${{ pin_subpackage("libnvinfer", exact=True) }}
        - ${{ pin_subpackage("libnvinfer-plugin", exact=True) }}
        - ${{ pin_subpackage("libnvonnxparser", exact=True) }}
        - cuda-cudart
      run_constraints:
        - if: aarch64
          then: arm-variant * ${{ arm_variant_type }}
      ignore_run_exports:
        by_name:
          - cuda-version
    tests:
      - package_contents:
          files:
            - if: linux
              then:
                - bin/trtexec
                - bin/tensorrt_player
            - if: win
              then:
                - Library/bin/trtexec.exe
      - script:
          - if: linux
            then:
              - trtexec --help
          - if: win
            then:
              - trtexec.exe --help
    about:
      summary: TensorRT command-line tools

  - package:
      name: libnvinfer-headers
    requirements:
      build:
        - if: linux
          then:
            - tar
        - if: win
          then:
            - libarchive
      run_constraints:
        - if: aarch64
          then: arm-variant * ${{ arm_variant_type }}
    tests:
      - package_contents:
          files:
            - if: linux
              then:
                - include/NvInfer.h
                - include/NvOnnxParser.h
            - if: win
              then:
                - Library/include/NvInfer.h
                - Library/include/NvOnnxParser.h
    about:
      summary: TensorRT development headers

  - package:
      name: libnvinfer-devel
    requirements:
      build:
        - if: linux
          then:
            - tar
        - if: win
          then:
            - libarchive
      host:
        - ${{ pin_subpackage("libnvinfer", exact=True) }}
        - ${{ pin_subpackage("libnvinfer-headers", exact=True) }}
      run:
        - ${{ pin_subpackage("libnvinfer", exact=True) }}
        - ${{ pin_subpackage("libnvinfer-headers", exact=True) }}
        - cuda-cudart-dev_${{ target_platform }}
        - cuda-crt-dev_${{ target_platform }}
      # Only the -devel outputs carry run_exports, because linking requires the
      # headers. The default lower bound pins the version built against.
      run_exports:
        - ${{ pin_subpackage("libnvinfer") }}
    tests:
      - package_contents:
          files:
            - if: linux
              then: lib/libnvinfer.so
            - if: win
              then: Library/lib/nvinfer_${{ soname }}.lib
    about:
      summary: TensorRT development libraries

  - package:
      name: libnvinfer-dispatch-devel
    requirements:
      build:
        - if: linux
          then:
            - tar
        - if: win
          then:
            - libarchive
      host:
        - ${{ pin_subpackage("libnvinfer-dispatch", exact=True) }}
        - ${{ pin_subpackage("libnvinfer-headers", exact=True) }}
      run:
        - ${{ pin_subpackage("libnvinfer-dispatch", exact=True) }}
        - ${{ pin_subpackage("libnvinfer-headers", exact=True) }}
        - cuda-cudart-dev_${{ target_platform }}
        - cuda-crt-dev_${{ target_platform }}
      run_exports:
        - ${{ pin_subpackage("libnvinfer-dispatch") }}
    tests:
      - package_contents:
          files:
            - if: linux
              then: lib/libnvinfer_dispatch.so
            - if: win
              then: Library/lib/nvinfer_dispatch_${{ soname }}.lib
    about:
      summary: TensorRT development dispatch runtime libraries

  - package:
      name: libnvinfer-lean-devel
    requirements:
      build:
        - if: linux
          then:
            - tar
        - if: win
          then:
            - libarchive
      host:
        - ${{ pin_subpackage("libnvinfer-lean", exact=True) }}
        - ${{ pin_subpackage("libnvinfer-headers", exact=True) }}
      run:
        - ${{ pin_subpackage("libnvinfer-lean", exact=True) }}
        - ${{ pin_subpackage("libnvinfer-headers", exact=True) }}
        - cuda-cudart-dev_${{ target_platform }}
        - cuda-crt-dev_${{ target_platform }}
      run_exports:
        - ${{ pin_subpackage("libnvinfer-lean") }}
    tests:
      - package_contents:
          files:
            - if: linux
              then: lib/libnvinfer_lean.so
            - if: win
              then: Library/lib/nvinfer_lean_${{ soname }}.lib
    about:
      summary: TensorRT lean runtime development libraries

  - package:
      name: libnvinfer-plugin-devel
    requirements:
      build:
        - if: linux
          then:
            - tar
        - if: win
          then:
            - libarchive
      host:
        - ${{ pin_subpackage("libnvinfer-plugin", exact=True) }}
        - ${{ pin_subpackage("libnvinfer-headers", exact=True) }}
      run:
        - ${{ pin_subpackage("libnvinfer-plugin", exact=True) }}
        - ${{ pin_subpackage("libnvinfer-headers", exact=True) }}
        - cuda-cudart-dev_${{ target_platform }}
        - cuda-crt-dev_${{ target_platform }}
      run_exports:
        - ${{ pin_subpackage("libnvinfer-plugin") }}
    tests:
      - package_contents:
          files:
            - if: linux
              then: lib/libnvinfer_plugin.so
            - if: win
              then: Library/lib/nvinfer_plugin_${{ soname }}.lib
    about:
      summary: TensorRT plugin development libraries

  - package:
      name: libnvinfer-vc-plugin-devel
    requirements:
      build:
        - if: linux
          then:
            - tar
        - if: win
          then:
            - libarchive
      host:
        - ${{ pin_subpackage("libnvinfer-vc-plugin", exact=True) }}
        - ${{ pin_subpackage("libnvinfer-headers", exact=True) }}
      run:
        - ${{ pin_subpackage("libnvinfer-vc-plugin", exact=True) }}
        - ${{ pin_subpackage("libnvinfer-headers", exact=True) }}
        - cuda-cudart-dev_${{ target_platform }}
        - cuda-crt-dev_${{ target_platform }}
      run_exports:
        - ${{ pin_subpackage("libnvinfer-vc-plugin") }}
    tests:
      - package_contents:
          files:
            - if: linux
              then: lib/libnvinfer_vc_plugin.so
            - if: win
              then: Library/lib/nvinfer_vc_plugin_${{ soname }}.lib
    about:
      summary: TensorRT version-compatible plugin development libraries

  - package:
      name: libnvonnxparser-devel
    requirements:
      build:
        - if: linux
          then:
            - tar
        - if: win
          then:
            - libarchive
      host:
        - ${{ pin_subpackage("libnvonnxparser", exact=True) }}
        - ${{ pin_subpackage("libnvinfer-headers", exact=True) }}
      run:
        - ${{ pin_subpackage("libnvonnxparser", exact=True) }}
        - ${{ pin_subpackage("libnvinfer-headers", exact=True) }}
        - cuda-cudart-dev_${{ target_platform }}
        - cuda-crt-dev_${{ target_platform }}
      run_exports:
        - ${{ pin_subpackage("libnvonnxparser") }}
    tests:
      - package_contents:
          files:
            - if: linux
              then: lib/libnvonnxparser.so
            - if: win
              then: Library/lib/nvonnxparser_${{ soname }}.lib
    about:
      summary: TensorRT ONNX parser development libraries

about:
  homepage: https://developer.nvidia.com/tensorrt
  license: LicenseRef-NVIDIA-TensorRT-SDK
  license_file:
    - doc/README.txt
    - doc/Acknowledgements.txt
  summary: Runtime libraries and development files for NVIDIA TensorRT
  description: |
    NVIDIA TensorRT is an SDK for high-performance deep learning inference.
    These packages provide its shared runtime libraries and matching SDK
    development files.
  documentation: https://docs.nvidia.com/deeplearning/tensorrt/
  repository: https://github.com/NVIDIA/TensorRT

extra:
  feedstock-name: tensorrt
  recipe-maintainers:
    - conda-forge/cuda
